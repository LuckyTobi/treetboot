<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Leonardo's Tretboot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: sans-serif; touch-action: none; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 16px; pointer-events: none; z-index: 10;
  }
  .badge {
    font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.95);
    background: rgba(0,0,0,0.45); border-radius: 20px;
    padding: 6px 14px; letter-spacing: 0.3px;
    border: 1px solid rgba(255,255,255,0.15);
    transition: opacity 0.2s;
  }
  #bottom-ui {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding-bottom: 18px; pointer-events: none; z-index: 10;
  }
  #speed-wrap { display: flex; align-items: center; gap: 8px; }
  #speed-bar-bg {
    width: 130px; height: 7px; background: rgba(255,255,255,0.2);
    border-radius: 4px; overflow: hidden;
  }
  #speed-bar-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #f0c040, #e07020);
    border-radius: 4px; transition: width 0.08s;
  }
  #hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 14px; color: rgba(255,255,255,0.9);
    background: rgba(0,0,0,0.55); padding: 10px 18px;
    border-radius: 14px; text-align: center; line-height: 1.6;
    z-index: 20; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.15);
  }
  #tap-left, #tap-right {
    position: fixed; top: 0; bottom: 70px; width: 50%; z-index: 5;
  }
  #tap-left { left: 0; }
  #tap-right { right: 0; }
  #compass {
    position: fixed; top: 14px; right: 16px;
    width: 52px; height: 52px; z-index: 10; pointer-events: none;
  }
  #collision-flash {
    position: fixed; inset: 0; background: rgba(255,60,60,0);
    pointer-events: none; z-index: 30;
    transition: background 0.1s;
  }
</style>
</head>
<body>
<div id="tap-left"></div>
<div id="tap-right"></div>
<div id="collision-flash"></div>

<div id="ui">
  <span class="badge" id="badge-left">👈 Links</span>
  <span style="width:52px"></span>
</div>
<div id="bottom-ui">
  <div id="speed-wrap">
    <span class="badge" style="font-size:11px;">Geschwindigkeit</span>
    <div id="speed-bar-bg"><div id="speed-bar-fill"></div></div>
  </div>
  <span class="badge" id="badge-right" style="align-self:flex-end; margin-right:16px;">Rechts 👉</span>
</div>
<svg id="compass" viewBox="0 0 52 52">
  <circle cx="26" cy="26" r="25" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="26" y="13" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-family="sans-serif">N</text>
  <line id="compass-needle" x1="26" y1="26" x2="26" y2="8" stroke="#f04040" stroke-width="2.5" stroke-linecap="round"/>
  <line id="compass-tail" x1="26" y1="26" x2="26" y2="38" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <circle cx="26" cy="26" r="3" fill="#fff"/>
</svg>
<div id="hint">Wechselnd links/rechts tippen zum Starten<br>📱 Handy neigen zum Lenken</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

const ambient = new THREE.AmbientLight(0xfff0d0, 0.65);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff5e0, 1.45);
sun.position.set(80, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 400;
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
scene.add(sun);
scene.background = new THREE.Color(0x87ceeb);

// Water
const waterGeo = new THREE.PlaneGeometry(600, 600, 80, 80);
const waterMat = new THREE.MeshPhongMaterial({
  color: 0x1a6fa0, specular: 0x88ccff, shininess: 60,
  side: THREE.DoubleSide, transparent: true, opacity: 0.92
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI / 2;
water.receiveShadow = true;
scene.add(water);
const wPos = waterGeo.attributes.position;
const wOrigY = [];
for (let i = 0; i < wPos.count; i++) wOrigY.push(wPos.getY(i));

// ── BOAT: farbiges Holzmodell nach der Museums-/3D-Vorlage ──
// Wichtig: Die Vorrichtung/der Sockel unter dem Boot aus der Vorlage wird NICHT übernommen.
const boatGroup = new THREE.Group();
scene.add(boatGroup);

const woodDark = new THREE.MeshPhongMaterial({ color: 0x4a2b16, specular: 0x241207, shininess: 14 });
const woodHull = new THREE.MeshPhongMaterial({ color: 0x7b4722, specular: 0x2b1609, shininess: 20 });
const woodMid = new THREE.MeshPhongMaterial({ color: 0x9a6030, specular: 0x3d210d, shininess: 18 });
const woodLight = new THREE.MeshPhongMaterial({ color: 0xc58a4b, specular: 0x5b3215, shininess: 22 });
const mechanismMat = new THREE.MeshPhongMaterial({ color: 0x8a6a45, specular: 0x5a4631, shininess: 32 });
const metalDark = new THREE.MeshPhongMaterial({ color: 0x4d4740, specular: 0x77716b, shininess: 48 });

function addBeam(parent, from, to, thickness, material) {
  const a = new THREE.Vector3(from[0], from[1], from[2]);
  const b = new THREE.Vector3(to[0], to[1], to[2]);
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(thickness, len, thickness), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

function makeHullShape(scale = 1) {
  const s = new THREE.Shape();
  s.moveTo(-0.34 * scale, -2.00 * scale);
  s.lineTo(-0.62 * scale, -1.45 * scale);
  s.lineTo(-0.70 * scale, 0.75 * scale);
  s.lineTo(-0.54 * scale, 1.48 * scale);
  s.lineTo(0, 2.30 * scale);
  s.lineTo(0.54 * scale, 1.48 * scale);
  s.lineTo(0.70 * scale, 0.75 * scale);
  s.lineTo(0.62 * scale, -1.45 * scale);
  s.lineTo(0.34 * scale, -2.00 * scale);
  s.closePath();
  return s;
}

// Massiver Rumpf in warmem Holzbraun.
const hullGeo = new THREE.ExtrudeGeometry(makeHullShape(1), {
  depth: 0.58,
  bevelEnabled: true,
  bevelThickness: 0.07,
  bevelSize: 0.07,
  bevelSegments: 3
});
const hull = new THREE.Mesh(hullGeo, woodHull);
hull.rotation.x = Math.PI / 2;
hull.position.y = 0.02;
hull.castShadow = true;
boatGroup.add(hull);

// Dunkle Innenfläche erzeugt den Eindruck eines offenen Holzbootes.
const innerGeo = new THREE.ExtrudeGeometry(makeHullShape(0.84), {
  depth: 0.035,
  bevelEnabled: false
});
const inner = new THREE.Mesh(innerGeo, woodDark);
inner.rotation.x = Math.PI / 2;
inner.position.y = 0.44;
boatGroup.add(inner);

// Obere Holzleisten / Dollbord – nur am Boot, keine Unterkonstruktion.
addBeam(boatGroup, [-0.62,0.49,-1.42], [-0.70,0.49,0.72], 0.07, woodLight);
addBeam(boatGroup, [ 0.62,0.49,-1.42], [ 0.70,0.49,0.72], 0.07, woodLight);
addBeam(boatGroup, [-0.70,0.49,0.72], [-0.50,0.49,1.55], 0.07, woodLight);
addBeam(boatGroup, [ 0.70,0.49,0.72], [ 0.50,0.49,1.55], 0.07, woodLight);

// Sitzbänke wie beim historischen Holzboot.
[-1.05, 0.95].forEach(zPos => {
  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.08, 0.18), woodLight);
  seat.position.set(0, 0.55, zPos);
  seat.castShadow = true;
  boatGroup.add(seat);
});

// Durchgehende Querachse für beide großen Schaufelräder.
const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 2.65, 12), metalDark);
axle.rotation.z = Math.PI / 2;
axle.position.set(0, 0.98, 0.02);
axle.castShadow = true;
boatGroup.add(axle);

// Hohe seitliche Holzrahmen – sie sitzen auf/seitlich am Rumpf, nicht darunter.
function makeSideFrame(side) {
  const g = new THREE.Group();
  const sx = side * 0.78;
  addBeam(g, [sx,0.45,-0.62], [sx,0.98,0.02], 0.085, woodMid);
  addBeam(g, [sx,0.98,0.02], [sx,1.88,-0.78], 0.085, woodMid);
  addBeam(g, [sx,0.45, 0.62], [sx,0.98,0.02], 0.085, woodMid);
  addBeam(g, [sx,0.98,0.02], [sx,1.88, 0.78], 0.085, woodMid);
  addBeam(g, [sx,1.88,-0.78], [sx,1.88,0.78], 0.07, woodMid);
  addBeam(g, [sx,0.45,-0.62], [sx,0.45,0.62], 0.07, woodMid);

  const bearing = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.12,12), mechanismMat);
  bearing.rotation.z = Math.PI / 2;
  bearing.position.set(sx,0.98,0.02);
  bearing.castShadow = true;
  g.add(bearing);
  return g;
}
boatGroup.add(makeSideFrame(-1));
boatGroup.add(makeSideFrame(1));

// Sichtbare zentrale Zahnrad-/Kurbelmechanik wie in der Vorlage.
function makeGear(radius, teeth, x, y, z, material) {
  const g = new THREE.Group();
  const disk = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.13, 20), material);
  disk.rotation.z = Math.PI / 2;
  disk.castShadow = true;
  g.add(disk);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius*0.20, radius*0.20, 0.18, 12), metalDark);
  hub.rotation.z = Math.PI / 2;
  g.add(hub);

  for (let i=0;i<teeth;i++) {
    const a = i / teeth * Math.PI * 2;
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.09, 0.08), woodLight);
    tooth.position.set(0, Math.cos(a)*(radius+0.045), Math.sin(a)*(radius+0.045));
    tooth.rotation.x = a;
    tooth.castShadow = true;
    g.add(tooth);
  }
  g.position.set(x,y,z);
  return g;
}

const gearMain = makeGear(0.42, 14, -0.12, 0.72, -0.35, mechanismMat);
const gearFront = makeGear(0.30, 10, 0.18, 0.72, 0.28, woodLight);
boatGroup.add(gearMain);
boatGroup.add(gearFront);

// Kleine Speichenräder links/rechts der Mechanik.
function makeSpokedGear(x,z) {
  const g = new THREE.Group();
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.32,0.035,6,18), woodLight);
  rim.rotation.y = Math.PI/2;
  g.add(rim);
  for(let i=0;i<8;i++) {
    const a=i/8*Math.PI*2;
    const spoke=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.31,0.045), mechanismMat);
    spoke.rotation.x=a;
    g.add(spoke);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.12,10), metalDark);
  hub.rotation.z=Math.PI/2;
  g.add(hub);
  g.position.set(x,0.76,z);
  return g;
}
boatGroup.add(makeSpokedGear(-0.34,0.18));
boatGroup.add(makeSpokedGear(0.34,0.18));

// Große vierflügelige Schaufelräder – deutlich näher am gezeigten Modell.
function makePaddleWheel(side) {
  const g = new THREE.Group();

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.16,12), mechanismMat);
  hub.rotation.z = Math.PI/2;
  hub.castShadow = true;
  g.add(hub);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.64,0.045,7,24), woodLight);
  rim.rotation.y = Math.PI/2;
  rim.castShadow = true;
  g.add(rim);

  // Zwei lange, gekreuzte Holzarme ergeben vier Arme.
  for(let i=0;i<2;i++) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.11, 1.85, 0.11), woodMid);
    arm.rotation.x = i * Math.PI/2;
    arm.castShadow = true;
    g.add(arm);
  }

  // Vier breite Schaufeln an den Enden.
  for(let i=0;i<4;i++) {
    const a = i/4*Math.PI*2;
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.38,0.54), woodLight);
    blade.position.set(0, Math.cos(a)*1.03, Math.sin(a)*1.03);
    blade.rotation.x = a;
    blade.castShadow = true;
    g.add(blade);

    // Kleine Verbindung zwischen Ring und Schaufel.
    addBeam(g,
      [0, Math.cos(a)*0.63, Math.sin(a)*0.63],
      [0, Math.cos(a)*0.91, Math.sin(a)*0.91],
      0.07, woodMid);
  }

  g.position.set(side * 0.96, 0.98, 0.02);
  return g;
}

const wheelL = makePaddleWheel(-1);
const wheelR = makePaddleWheel(1);
boatGroup.add(wheelL);
boatGroup.add(wheelR);

// Ruder am Heck gehört zum Boot und bleibt erhalten.
const rudderPost = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.72,7), woodDark);
rudderPost.position.set(0,0.12,-2.00);
rudderPost.castShadow = true;
boatGroup.add(rudderPost);
const rudderBlade = new THREE.Mesh(new THREE.BoxGeometry(0.30,0.34,0.04), woodMid);
rudderBlade.position.set(0,-0.24,-2.03);
rudderBlade.castShadow = true;
boatGroup.add(rudderBlade);
const tiller = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.60,7), woodLight);
tiller.position.set(0,0.48,-2.12);
tiller.rotation.x = Math.PI/2.6;
boatGroup.add(tiller);

// Wake particles
const wakeParticles = [];
function spawnWake(x, z) {
  if (wakeParticles.length > 60) {
    const old = wakeParticles.shift();
    scene.remove(old.mesh);
  }
  const geo = new THREE.SphereGeometry(0.08 + Math.random()*0.1, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x + (Math.random()-0.5)*0.5, 0.05, z + (Math.random()-0.5)*0.5);
  scene.add(m);
  wakeParticles.push({ mesh: m, life: 1.0 });
}

// ── ISLANDS ──
const islandData = [
  { x: 25, z: -18, r: 3.5 },
  { x: -30, z: 20, r: 4.2 },
  { x: 50, z: 30, r: 2.8 },
  { x: -20, z: -45, r: 5.0 },
  { x: 60, z: -50, r: 3.0 },
  { x: -55, z: -30, r: 3.8 },
  { x: 80, z: 10, r: 4.0 },
  { x: -70, z: 60, r: 3.2 },
  { x: 10, z: 70, r: 4.5 },
  { x: -10, z: -80, r: 3.0 },
  { x: 40, z: 80, r: 2.5 },
  { x: -80, z: -10, r: 3.5 },
];

islandData.forEach(d => {
  const g = new THREE.Group();
  const beachGeo = new THREE.CylinderGeometry(d.r, d.r * 1.2, 0.5, 12);
  const beachMat = new THREE.MeshPhongMaterial({ color: 0xf0d87a });
  const beach = new THREE.Mesh(beachGeo, beachMat);
  beach.receiveShadow = true;
  beach.castShadow = true;
  g.add(beach);

  const grassGeo = new THREE.CylinderGeometry(d.r * 0.7, d.r * 0.9, 0.4, 12);
  const grassMat = new THREE.MeshPhongMaterial({ color: 0x3a9a30 });
  const grass = new THREE.Mesh(grassGeo, grassMat);
  grass.position.y = 0.4;
  grass.castShadow = true;
  g.add(grass);

  const hillGeo = new THREE.SphereGeometry(d.r * 0.65, 10, 6);
  const hillMat = new THREE.MeshPhongMaterial({ color: 0x4aaa38 });
  const hill = new THREE.Mesh(hillGeo, hillMat);
  hill.position.y = 0.55;
  hill.scale.y = 0.45;
  hill.castShadow = true;
  g.add(hill);

  const trunkGeo = new THREE.CylinderGeometry(0.07, 0.12, 2.2, 6);
  const trunkMat = new THREE.MeshPhongMaterial({ color: 0x8B6010 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 1.55;
  trunk.rotation.z = (Math.random() - 0.5) * 0.3;
  trunk.castShadow = true;
  g.add(trunk);

  const leafMat = new THREE.MeshPhongMaterial({ color: 0x2d8020, side: THREE.DoubleSide });
  for (let i = 0; i < 6; i++) {
    const la = (i / 6) * Math.PI * 2;
    const leafGeo = new THREE.ConeGeometry(0.5, 1.0, 4);
    const leaf = new THREE.Mesh(leafGeo, leafMat);
    leaf.position.set(Math.cos(la)*0.55, 2.7, Math.sin(la)*0.55);
    leaf.rotation.z = Math.cos(la) * 0.8;
    leaf.rotation.x = Math.sin(la) * 0.8;
    leaf.castShadow = true;
    g.add(leaf);
  }

  g.position.set(d.x, 0, d.z);
  scene.add(g);
});

// ── GAME STATE ──
const gs = {
  x: 0, z: 0, angle: 0,
  speed: 0, maxSpeed: 5,
  wheelRot: 0,
  nextExpected: 'left',
  combo: 0,
  tilt: 0,
  started: false,
  collisionCooldown: 0,
};

const camOffset = new THREE.Vector3(0, 4.5, 9);
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();

let gyroReady = false;
function requestGyro() {
  if (gyroReady) return;
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(r => {
      if (r === 'granted') startGyro();
    }).catch(() => {});
  } else {
    startGyro();
  }
}
function startGyro() {
  window.addEventListener('deviceorientation', e => {
    if (e.gamma !== null) {
      gyroReady = true;
      gs.tilt = Math.max(-1, Math.min(1, e.gamma / 30));
    }
  });
}

function handleTap(side) {
  requestGyro();
  if (!gs.started) {
    gs.started = true;
    document.getElementById('hint').style.display = 'none';
  }
  if (side === gs.nextExpected) {
    gs.combo++;
    gs.speed = Math.min(gs.maxSpeed, gs.speed + 0.4 + gs.combo * 0.05);
    gs.nextExpected = side === 'left' ? 'right' : 'left';
  } else {
    gs.combo = 0;
    gs.speed = Math.max(0, gs.speed - 0.4);
  }
}

document.getElementById('tap-left').addEventListener('touchstart', e => { e.preventDefault(); handleTap('left'); }, { passive: false });
document.getElementById('tap-right').addEventListener('touchstart', e => { e.preventDefault(); handleTap('right'); }, { passive: false });
document.getElementById('tap-left').addEventListener('mousedown', () => handleTap('left'));
document.getElementById('tap-right').addEventListener('mousedown', () => handleTap('right'));

function checkCollisions() {
  if (gs.collisionCooldown > 0) return;
  for (const d of islandData) {
    const dx = gs.x - d.x;
    const dz = gs.z - d.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < d.r * 1.15 + 1.2) {
      gs.speed = -1.2;
      gs.x += (dx / dist) * 1.5;
      gs.z += (dz / dist) * 1.5;
      gs.collisionCooldown = 40;
      gs.combo = 0;
      const flash = document.getElementById('collision-flash');
      flash.style.background = 'rgba(255,60,60,0.4)';
      setTimeout(() => { flash.style.background = 'rgba(255,60,60,0)'; }, 180);
      return;
    }
  }
}

let lastTime = 0;
let wakeTimer = 0;
function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min((t - lastTime) / 16.67, 3);
  lastTime = t;

  const time = t * 0.001;
  for (let i = 0; i < wPos.count; i++) {
    const x = wPos.getX(i);
    const z = wPos.getZ(i);
    wPos.setZ(i, Math.sin(x * 0.3 + time) * 0.18 + Math.cos(z * 0.25 + time * 1.1) * 0.12);
  }
  wPos.needsUpdate = true;
  waterGeo.computeVertexNormals();

  if (gs.collisionCooldown > 0) gs.collisionCooldown -= dt;
  gs.speed *= Math.pow(0.982, dt);
  if (Math.abs(gs.speed) < 0.005) { gs.speed = 0; gs.combo = 0; }

  if (gs.speed > 0.05 || gs.speed < -0.05) {
    gs.angle += gs.tilt * 0.028 * dt * (gs.speed / gs.maxSpeed);
  }
  gs.x += Math.sin(gs.angle) * gs.speed * dt * 0.18;
  gs.z += Math.cos(gs.angle) * gs.speed * dt * 0.18;

  gs.wheelRot += gs.speed * 0.07 * dt;
  wheelL.rotation.x = gs.wheelRot;
  wheelR.rotation.x = gs.wheelRot;
  // Die sichtbaren Zahnräder drehen leicht mit und machen die Mechanik verständlicher.
  gearMain.rotation.x = -gs.wheelRot * 1.25;
  gearFront.rotation.x = gs.wheelRot * 1.6;

  checkCollisions();
  boatGroup.position.set(gs.x, 0, gs.z);
  boatGroup.rotation.y = gs.angle;
  boatGroup.rotation.z = Math.sin(time * 1.2) * 0.03;
  boatGroup.rotation.x = Math.cos(time * 0.9) * 0.02;
  boatGroup.position.y = Math.sin(time * 1.5) * 0.06;

  if (gs.speed > 0.5) {
    wakeTimer += dt;
    if (wakeTimer > 3) {
      wakeTimer = 0;
      spawnWake(gs.x, gs.z);
    }
  }
  for (let i = wakeParticles.length - 1; i >= 0; i--) {
    const p = wakeParticles[i];
    p.life -= 0.012 * dt;
    p.mesh.material.opacity = p.life * 0.5;
    p.mesh.scale.setScalar(1 + (1 - p.life) * 1.5);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      wakeParticles.splice(i, 1);
    }
  }

  const behindX = gs.x - Math.sin(gs.angle) * camOffset.z;
  const behindZ = gs.z - Math.cos(gs.angle) * camOffset.z;
  const targetCam = new THREE.Vector3(behindX, camOffset.y, behindZ);
  camPos.lerp(targetCam, 0.07);
  camera.position.copy(camPos);
  camTarget.lerp(new THREE.Vector3(gs.x, 0.8, gs.z), 0.1);
  camera.lookAt(camTarget);

  const needle = document.getElementById('compass-needle');
  const tail = document.getElementById('compass-tail');
  const nx = 26 + Math.sin(gs.angle) * 18;
  const ny = 26 - Math.cos(gs.angle) * 18;
  const tx = 26 - Math.sin(gs.angle) * 12;
  const ty = 26 + Math.cos(gs.angle) * 12;
  needle.setAttribute('x2', nx); needle.setAttribute('y2', ny);
  tail.setAttribute('x2', tx); tail.setAttribute('y2', ty);

  const fillEl = document.getElementById('speed-bar-fill');
  if (fillEl) fillEl.style.width = Math.round(Math.max(0, gs.speed / gs.maxSpeed) * 100) + '%';

  const bL = document.getElementById('badge-left');
  const bR = document.getElementById('badge-right');
  if (bL) bL.style.opacity = gs.nextExpected === 'left' ? '1' : '0.35';
  if (bR) bR.style.opacity = gs.nextExpected === 'right' ? '1' : '0.35';

  renderer.render(scene, camera);
}

camPos.set(0, 5, 9);
camera.position.copy(camPos);
camera.lookAt(0, 0, 0);
requestAnimationFrame(animate);
</script>
</body>
</html>
