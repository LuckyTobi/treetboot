<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Leonardo's Tretboot</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="tap-left"></div>
<div id="tap-right"></div>
<div id="collision-flash"></div>

<div id="ui">
  <span class="badge" id="badge-left">👈 Links</span>
  <span style="width:52px"></span>
</div>
<div class="badge" id="fish-counter">🐟 0 / 3</div>
<div id="bottom-ui">
  <div id="speed-wrap">
    <span class="badge" style="font-size:11px;">Geschwindigkeit</span>
    <div id="speed-bar-bg"><div id="speed-bar-fill"></div></div>
  </div>
  <span class="badge" id="badge-right" style="align-self:flex-end; margin-right:16px;">Rechts 👉</span>
</div>
<svg id="compass" viewBox="0 0 52 52">
  <circle cx="26" cy="26" r="25" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="26" y="13" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-family="sans-serif">N</text>
  <line id="compass-needle" x1="26" y1="26" x2="26" y2="8" stroke="#f04040" stroke-width="2.5" stroke-linecap="round"/>
  <line id="compass-tail" x1="26" y1="26" x2="26" y2="38" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <circle cx="26" cy="26" r="3" fill="#fff"/>
</svg>
<div id="hint">Abwechselnd links und rechts tippen 🚣<br>📱 Handy neigen zum Lenken</div>

<div class="mission-overlay" id="mission-overlay">
  <div class="mission-card">
    <div class="mission-fish">🐟</div>
    <h1>Deine Aufgabe</h1>
    <p><strong>Versuche 3 Fische zu sammeln!</strong></p>
    <p class="small-note">Fahre mit Leonardos Tretboot durch die drei Fisch-Felder im Wasser.</p>
    <button id="start-mission">Los geht's!</button>
  </div>
</div>

<div class="mission-overlay" id="success-overlay">
  <div class="mission-card">
    <div class="mission-fish">🎉🐟🎉</div>
    <h1>Hurra, du hast es geschafft!</h1>
    <p><strong>Carl und Anna haben drei Fische gefangen!</strong></p>
    <button id="restart-mission">Nochmal spielen</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./boat.js"></script>
<script src="./world.js"></script>
<script src="./game.js"></script>
</body>
</html>
